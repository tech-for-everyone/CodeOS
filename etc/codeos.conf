# CodeOS system configuration
# Managed by the package manager

hostname=codeos
user=code
timezone=CDT
keyboard_layout=us
default_shell=/bin/sh

# Network
network.dhcp=1
network.hostname=codeos

# Display
display.resolution=1080x1920
display.dpi=96

# Packages
pkg.repositories=core,extra,dev,util,ccp
pkg.autoupdate=0
