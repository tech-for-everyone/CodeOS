[Paths]
Prefix=../
Documentation=doc
Headers=include
Libraries=lib
LibraryExecutables=libexec
Binaries=bin
Plugins=plugins
QmlImports=qml
ArchData=.
Data=.
Translations=translations
Examples=examples
Tests=tests
Settings=etc/xdg
HostPrefix=../../../../../../../usr
HostBinaries=lib/qt6/bin
HostLibraries=lib
HostLibraryExecutables=lib/qt6
# qmake resolves HostData against HostPrefix, not against this file, so it
# cannot be a conf-file-relative path. Export CODEOS_ROOT as the checkout root.
HostData=$(CODEOS_ROOT)/qt6/sysroot/usr
Sysroot=
SysrootifyPrefix=false
TargetSpec=codeos-g++
HostSpec=linux-g++
