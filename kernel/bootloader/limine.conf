# ╔══════════════════════════════════════════════════════════════╗
# ║  CodeOS Boot Menu — Limine Configuration                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Global Settings ──────────────────────────────────────────
timeout: 5
default_entry: 1
serial: yes
verbose: yes
remember_last_entry: yes
editor_enabled: yes
editor_highlighting: yes

# ── Interface ────────────────────────────────────────────────
interface_branding: CodeOS v1.4.0
interface_branding_colour: f07040
interface_help_colour: 8a8a9e
interface_help_colour_bright: b0acc8
interface_help_hidden: no

# ── Wallpaper ────────────────────────────────────────────────
wallpaper: boot():/boot/splash.png
wallpaper_style: stretched

# ── Terminal Colors (GG Orange theme) ────────────────────────
# Normal:  black;red;green;brown;blue;magenta;cyan;gray
term_palette: 1a1a2e;ff5a36;7ec8a0;e8a838;4a9eff;c792ea;67d9e8;b0b8c8
# Bright:  dkgray;brred;brgreen;yellow;brblue;brmagenta;brcyan;white
term_palette_bright: 3a3a5e;ff7a56;a0e8c0;f0c860;7ac0ff;d9b2fa;87e9f8;e8ecf4
# Terminal colours are TTRRGGBB (alpha byte FIRST). The old 0a…ff values
# put the alpha in the BLUE slot, rendering a vivid goofy blue menu.
term_background: 000a0a1e
term_foreground: b0b8c8
term_background_bright: 000a0a1e
term_foreground_bright: e8ecf4
term_margin: 4
term_margin_gradient: 8
term_font_scale: 1x1
term_font_spacing: 1

# ═══════════════════════════════════════════════════════════════
# Boot Entries
# ═══════════════════════════════════════════════════════════════

/CodeOS
    comment: CodeOS desktop environment
    protocol: limine
    kernel_path: boot():/boot/codeos-1-kernel.bin
    cmdline: loglevel=4 httpsboot

/CodeOS (Recovery)
    comment: Boot into single-user recovery mode
    protocol: limine
    kernel_path: boot():/boot/codeos-1-kernel.bin
    cmdline: loglevel=4 recovery

/CodeOS (Safe Mode)
    comment: Boot with minimal drivers and services
    protocol: limine
    kernel_path: boot():/boot/codeos-1-kernel.bin
    cmdline: loglevel=4 safemode

# ── Zircon OS ──
/Zircon
    comment: Zircon OS — Google-free mobile/desktop OS
    protocol: limine
    kernel_path: boot():/boot/zircon-kernel.bin
    cmdline: loglevel=4 zircon.init=/sbin/zircon_init

/Zircon (Debug)
    comment: Boot Zircon with debug output
    protocol: limine
    kernel_path: boot():/boot/zircon-kernel.bin
    cmdline: loglevel=8 zircon.init=/sbin/zircon_init debug
