# HyperDE's user configuration. Restart Chroma or HWMS after changing it.

[compositor]
panel_height = 28

[window_manager]
workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
terminal_command = "xterm"
launcher_command = ""
normal_border = "#3c3836ff"
focused_border = "#cc241dff"
border_width = 2
focus_follow_mouse = true
floating_classes = ["dmenu", "dunst"]

[applications]
# Commands started when HWMS launches. Leave empty to disable startup apps.
startup = []

# Add a keybinding for any command. Use Penrose syntax, for example "M-c".
commands = [
	{ name = "Browser", key = "M-b", command = "firefox", terminal = false },
	{ name = "File manager", key = "M-e", command = "thunar", terminal = false },
	{ name = "System monitor", key = "M-t", command = "btop", terminal = true },
]